<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartTalk AI Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styling for the bot icon */
        .bot-reply-container {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .robot-icon {
            font-size: 1.5rem; /* Larger icon */
            line-height: 1; /* Aligns text correctly */
            color: #1E40AF; /* Darker blue to match header */
        }
        /* Custom scrollbar for better aesthetics */
        #chat-window::-webkit-scrollbar {
            width: 8px;
        }
        #chat-window::-webkit-scrollbar-thumb {
            background-color: #A3A3A3; /* Gray-400 */
            border-radius: 10px;
        }
        #chat-window::-webkit-scrollbar-track {
            /* Using a light background that matches the chat window */
            background: #FFF7FA; 
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        'pink-100': '#FCE7F6', // Lighter pink for body background
                        'pink-50': '#FFF7FA',  // Lightest pink for chat space
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pink-100 flex items-center justify-center min-h-screen font-sans p-4">

    <!-- Chatbot Container -->
    <div class="w-full max-w-lg bg-pink-50 shadow-xl rounded-xl overflow-hidden flex flex-col h-[85vh] md:h-[700px]">

        <!-- Header (Bluish Color) -->
        <header class="bg-blue-700 p-4 text-white shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold">SmartTalk AI</h1>
            <span class="text-sm opacity-80">Your friendly assistant</span>
        </header>

        <!-- Chat Window (Lightish Pink Space) -->
        <div id="chat-window" class="flex-grow p-4 space-y-4 overflow-y-auto bg-pink-50">
            <!-- Initial Greeting -->
            <div class="flex justify-start">
                <div class="bg-gray-200 text-gray-800 p-3 rounded-tr-xl rounded-bl-xl rounded-br-xl max-w-xs md:max-w-md shadow-sm">
                    <p>Hi there! I'm SmartTalk AI. I'm here to help with suggestions and simple advice. Ask me anything!</p>
                </div>
                <div class="self-end ml-1 robot-icon">🤖</div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-gray-200 flex space-x-2">
            <input type="text" id="user-input" placeholder="Type your message..."
                   class="flex-grow p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150">
            
            <!-- NEW: Plan Task Button -->
            <button id="plan-task-button" title="Generate a step-by-step plan for a topic"
                    class="bg-orange-500 hover:bg-orange-600 text-white p-3 rounded-lg flex items-center justify-center shadow-md transition duration-150 active:scale-95 text-sm font-semibold flex-shrink-0">
                Plan Task 📋
            </button>

            <button id="stt-button" title="Speak your message"
                    class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-lg flex items-center justify-center shadow-md transition duration-150 active:scale-95 flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>

            <button id="send-button"
                    class="bg-blue-500 hover:bg-blue-600 text-white p-3 rounded-lg flex items-center justify-center shadow-md transition duration-150 active:scale-95 flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send"><path d="m22 2-7 19-9-7L2 13l19-9Z"/><path d="M14.5 10H8.5"/></svg>
            </button>
        </div>
    </div>

    <!-- Modals for Alerts/Errors (Instead of alert()) -->
    <div id="modal-container" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full">
            <h3 class="text-lg font-semibold text-red-600 mb-4">Error</h3>
            <p id="modal-message" class="text-gray-700"></p>
            <button onclick="document.getElementById('modal-container').classList.add('hidden')"
                    class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition duration-150">
                Close
            </button>
        </div>
    </div>

    <!-- NEW Task Planner Input Modal -->
    <div id="task-planner-modal-container" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-lg shadow-2xl max-w-sm w-full">
            <h3 class="text-lg font-semibold text-orange-600 mb-4">Task Planner</h3>
            <p class="text-gray-700 mb-3">What task or event do you need a simple plan for (e.g., 'job interview', 'debate prep')?</p>
            <input type="text" id="task-topic-input" placeholder="Enter topic..."
                   class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500 transition duration-150">
            <div class="flex justify-end space-x-2 mt-4">
                <button onclick="document.getElementById('task-planner-modal-container').classList.add('hidden')"
                        class="bg-gray-300 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-400 transition duration-150">
                    Cancel
                </button>
                <button id="submit-task-topic"
                        class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 transition duration-150">
                    Generate Plan
                </button>
            </div>
        </div>
    </div>


    <script type="module">
        // Gemini API Configuration
        const apiKey = "AIzaSyD3eN6pPYdXkgvZOlb_zec20KC_VcVHntU";
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        // System Instruction to guide the AI's persona and tone
        const systemPrompt = "You are SmartTalk AI, a friendly, supportive, and knowledgeable chatbot. Your primary goal is to offer helpful suggestions and information using short, simple, and encouraging vocabulary. Keep your responses concise and conversational.";

        // UI Elements
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const sttButton = document.getElementById('stt-button');
        const modalContainer = document.getElementById('modal-container');
        const modalMessage = document.getElementById('modal-message');
        // NEW Task Planner Elements
        const planTaskButton = document.getElementById('plan-task-button');
        const taskPlannerModalContainer = document.getElementById('task-planner-modal-container');
        const taskTopicInput = document.getElementById('task-topic-input');
        const submitTaskTopicButton = document.getElementById('submit-task-topic');

        // --- Utility Functions ---

        /**
         * Shows a custom modal with an error message.
         * @param {string} message - The error message to display.
         */
        function showCustomAlert(message) {
            modalMessage.textContent = message;
            modalContainer.classList.remove('hidden');
        }

        /**
         * Scrolls the chat window to the bottom.
         */
        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * Creates and appends a message to the chat window.
         * @param {string} text - The message content.
         * @param {string} sender - 'user' or 'bot'.
         */
        function appendMessage(text, sender) {
            const messageContainer = document.createElement('div');
            messageContainer.className = 'flex ' + (sender === 'user' ? 'justify-end' : 'justify-start');

            const textBubble = document.createElement('div');
            textBubble.className = `p-3 rounded-xl max-w-xs md:max-w-md shadow-md ${
                sender === 'user'
                    ? 'bg-blue-500 text-white rounded-tr-none'
                    : 'bg-gray-200 text-gray-800 rounded-tl-none'
            }`;
            // Use innerHTML to support basic formatting (like the numbered list in the planner)
            textBubble.innerHTML = text.replace(/\n/g, '<br>');

            if (sender === 'user') {
                messageContainer.appendChild(textBubble);
            } else {
                // For bot replies, add the robot icon below and to the right of the bubble
                const botContainer = document.createElement('div');
                botContainer.className = 'flex flex-col items-start';
                botContainer.appendChild(textBubble);

                const icon = document.createElement('div');
                icon.className = 'text-sm mt-1 ml-1 robot-icon';
                icon.textContent = '🤖';

                botContainer.appendChild(icon);
                messageContainer.appendChild(botContainer);
            }

            chatWindow.appendChild(messageContainer);
            scrollToBottom();
        }
        
        // --- Core Gemini Logic ---

        /**
         * Sends a request to the Gemini API with exponential backoff.
         * @param {object} payload - The API request payload.
         * @param {string} failMessage - Message to display on failure.
         * @returns {Promise<string>} - The generated text response.
         */
        async function fetchGemini(payload, failMessage) {
            const maxRetries = 3;
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text || "Hmm, I didn't get a clear response. Can you rephrase that?";
                    } else if (response.status === 429 && attempt < maxRetries - 1) {
                        const delay = Math.pow(2, attempt) * 1000 + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue;
                    } else {
                        const errorData = await response.json();
                        console.error('API Error:', errorData);
                        return `${failMessage} (Code: ${response.status})`;
                    }
                } catch (error) {
                    console.error('Fetch error:', error);
                    return "There was a network error. Check your connection.";
                }
            }
            return failMessage;
        }

        // --- Main Chat Functionality ---

        /**
         * Sends the user message to the Gemini API.
         * @param {string} message - The user's input message.
         */
        async function getGeminiResponse(message) {
            appendMessage(message, 'user');
            userInput.value = '';
            setLoading(true);

            const payload = {
                contents: [{ parts: [{ text: message }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            const responseText = await fetchGemini(payload, "Sorry, I couldn't connect right now. Please try again.");

            appendMessage(responseText, 'bot');
            setLoading(false);
        }
        
        // --- NEW Task Planner Logic ---

        /**
         * Generates a step-by-step plan for the given topic.
         * @param {string} topic - The task topic provided by the user.
         */
        async function getTaskPlan(topic) {
            appendMessage(`I need a task plan for: **${topic}**`, 'user');
            setLoading(true);

            const planSystemPrompt = "You are SmartTalk AI's Task Planner. Generate a simple, numbered, step-by-step plan for the user's requested topic. The plan must be easy to follow and use short, encouraging vocabulary. Do not add any introductory or concluding sentences. Just output the numbered list.";
            
            const payload = {
                contents: [{ parts: [{ text: topic }] }],
                systemInstruction: { parts: [{ text: planSystemPrompt }] },
            };

            const responseText = await fetchGemini(payload, "Couldn't generate a plan for that right now. Try a simpler topic!");

            // Format response into HTML ordered list for better display
            let formattedResponse = responseText.split('\n')
                .filter(line => line.trim().match(/^\d+\.?\s/))
                .map(line => `<li>${line.replace(/^\d+\.?\s*/, '')}</li>`)
                .join('');
            
            if (formattedResponse) {
                formattedResponse = `<p class="font-semibold">Here is a simple plan for ${topic}:</p><ol class="list-decimal list-inside ml-4 mt-1 space-y-1">${formattedResponse}</ol>`;
            } else {
                 formattedResponse = responseText; // Fallback to raw text if formatting failed
            }


            appendMessage(formattedResponse, 'bot');
            setLoading(false);
        }

        /**
         * Handles the main process of sending a message.
         */
        function sendMessage() {
            const message = userInput.value.trim();
            if (message) {
                getGeminiResponse(message);
            } else {
                showCustomAlert("Please enter a message or use the microphone to speak.");
            }
        }

        /**
         * Sets the loading state by disabling/enabling buttons.
         * @param {boolean} isLoading
         */
        function setLoading(isLoading) {
            sendButton.disabled = isLoading;
            sttButton.disabled = isLoading;
            planTaskButton.disabled = isLoading; // Added new button
            userInput.disabled = isLoading;

            const buttons = [sendButton, sttButton, planTaskButton];
            buttons.forEach(btn => btn.classList.toggle('opacity-50', isLoading));

            if (isLoading) {
                 sendButton.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>`;
            } else {
                 sendButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send"><path d="m22 2-7 19-9-7L2 13l19-9Z"/><path d="M14.5 10H8.5"/></svg>`;
            }
        }


        // --- Speech-to-Text (STT) Functionality ---

        // Check for Web Speech API support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false; // Stop after the user stops speaking
            recognition.lang = 'en-US'; // Set language

            recognition.onstart = () => {
                sttButton.classList.remove('bg-green-500');
                sttButton.classList.add('bg-red-500', 'animate-pulse');
                sttButton.title = 'Speaking... Click to stop';
                userInput.placeholder = 'Listening...';
                sendButton.disabled = true;
                planTaskButton.disabled = true; // Disable new button during speech
                userInput.disabled = true;
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                let message = "Speech recognition failed. Please try typing.";
                if (event.error === 'not-allowed') {
                    message = "Microphone access denied. Please check your browser settings.";
                } else if (event.error === 'no-speech') {
                    message = "No speech detected. Please speak clearly.";
                }
                showCustomAlert(message);
                recognition.stop();
            };

            recognition.onend = () => {
                sttButton.classList.add('bg-green-500');
                sttButton.classList.remove('bg-red-500', 'animate-pulse');
                sttButton.title = 'Speak your message';
                userInput.placeholder = 'Type your message...';
                sendButton.disabled = false;
                planTaskButton.disabled = false; // Re-enable new button
                userInput.disabled = false;
            };

            sttButton.addEventListener('click', () => {
                try {
                    if (sttButton.classList.contains('bg-red-500')) {
                        // If currently recording, stop it
                        recognition.stop();
                    } else {
                        // If not recording, start it
                        recognition.start();
                    }
                } catch (e) {
                    // Catch cases where recognition is already active and start() is called
                    console.warn("Recognition start failed, might be already running or internal error:", e);
                }
            });

        } else {
            // Speech Recognition not supported
            sttButton.disabled = true;
            sttButton.title = 'Speech-to-Text is not supported by your browser.';
            // Only show alert if user tries to use it, not on load.
        }

        // --- Event Listeners ---
        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // NEW Task Planner Event Listeners
        planTaskButton.addEventListener('click', () => {
            taskTopicInput.value = '';
            taskPlannerModalContainer.classList.remove('hidden');
            taskTopicInput.focus();
        });

        submitTaskTopicButton.addEventListener('click', () => {
            const topic = taskTopicInput.value.trim();
            taskPlannerModalContainer.classList.add('hidden');

            if (topic) {
                getTaskPlan(topic);
            } else {
                showCustomAlert("Please enter a task topic to generate a plan.");
            }
        });
    </script>
</body>
</html>
